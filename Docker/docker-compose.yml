version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        PROJECT_NAME: YourProject
        PROJECT_PATH: Src/YourProject
        DOTNET_VERSION: "10.0"
    container_name: yourproject-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ..:/app:cached
    # Uncomment to enable hot reload during development
    # command: dotnet watch run --project Src/YourProject/YourProject.csproj

  # Example: Build a different project (e.g., background worker)
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #     args:
  #       PROJECT_NAME: YourProject.Worker
  #       PROJECT_PATH: Src/YourProject.Worker
  #       DOTNET_VERSION: "10.0"
  #   container_name: yourproject-worker
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #   volumes:
  #     - ..:/app:cached

