services:
  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        PROJECT_NAME: Api
        PROJECT_PATH: Src/Api
        DOTNET_VERSION: "10.0"
    container_name: locksmith-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ..:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        PROJECT_NAME: Agent
        PROJECT_PATH: Src/Agent
        DOTNET_VERSION: "10.0"
    container_name: locksmith-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ..:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Uncomment to enable hot reload during development
    # command: dotnet watch run --project Src/YourProject/YourProject.csproj

  # Example: Build a different project (e.g., background worker)
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #     args:
  #       PROJECT_NAME: YourProject.Worker
  #       PROJECT_PATH: Src/YourProject.Worker
  #       DOTNET_VERSION: "10.0"
  #   container_name: yourproject-worker
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #   volumes:
  #     - ..:/app:cached

  postgres:
    image: postgres:18.4-alpine
    container_name: locksmith-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: locksmith
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: locksmith-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
