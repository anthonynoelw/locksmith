services:
  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        PROJECT_NAME: Api
        PROJECT_PATH: Src/Api
        DOTNET_VERSION: "10.0"
    container_name: locksmith-api
    ports:
      - "${API_HOST_PORT}:${API_CONTAINER_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:${API_CONTAINER_PORT}
    volumes:
      - ..:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        PROJECT_NAME: Agent
        PROJECT_PATH: Src/Agent
        DOTNET_VERSION: "10.0"
    container_name: locksmith-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ..:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Uncomment to enable hot reload during development
  # command: dotnet watch run --project Src/YourProject/YourProject.csproj

  # Example: Build a different project (e.g., background worker)
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #     args:
  #       PROJECT_NAME: YourProject.Worker
  #       PROJECT_PATH: Src/YourProject.Worker
  #       DOTNET_VERSION: "10.0"
  #   container_name: yourproject-worker
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #   volumes:
  #     - ..:/app:cached

  postgres:
    image: postgres:${POSTGRES_VERSION}-alpine
    container_name: locksmith-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS-VERSION}-alpine
    container_name: locksmith-redis
    ports:
      - "{REDIS_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: